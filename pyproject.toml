[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wh40k-colony-manager"
version = "0.1.0"
description = "Rogue Trader Colony Manager prototype"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.10,<1",
  "fastapi>=0.109,<1",
  "uvicorn[standard]>=0.27,<1",
  "pyjwt>=2.8,<3",
  "bcrypt>=4.0,<5",
  "email-validator>=2.0,<3",
  "pdfplumber>=0.11.10",
  "slowapi>=0.1.9,<1",
  "alembic>=1.13,<2",
  "pymarkdownlnt>=0.9.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "hypothesis>=6.0,<8",
  "ruff>=0.0,<1",
  "mypy>=1.9,<2",
  "httpx2>=0.28",
]

[project.scripts]
wh40k-colony-manager = "colony_manager.adapters.cli.main:cli"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "dist", ".venv", "venv", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() pattern in function defaults is standard
    "DTZ011",  # date.today() is acceptable for date-only operations
    "SIM102",  # Nested if statements sometimes improve readability
    "LOG014",  # exc_info in logger.error is acceptable
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
disable_error_code = ["import-untyped"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
]
