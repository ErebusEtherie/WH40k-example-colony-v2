# WH40k Colony Manager - Docker Compose for Production
# For production deployment with reverse proxy
#
# Usage:
#   docker-compose -f docker-compose.prod.yml --env-file .env.production up -d

version: '3.8'

services:
  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    container_name: colony-backend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_PATH=/data/colony_manager.sqlite
    volumes:
      - backend-data:/data
      - ./config:/app/config:ro
    networks:
      - colony-network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # Frontend Web UI
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: colony-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8880:80"
    networks:
      - colony-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================
  # Traefik Reverse Proxy (Optional - include if not using external proxy)
  # ============================================
  # Uncomment if you want Traefik managed by this compose file
  # traefik:
  #   image: traefik:v2.10
  #   container_name: traefik
  #   restart: unless-stopped
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #     - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
  #     - "--certificatesresolvers.letsencrypt.acme.email=your@email.com"
  #     - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - traefik-letsencrypt:/letsencrypt
  #   networks:
  #     - colony-network

networks:
  colony-network:
    driver: bridge
    name: colony-network-prod

volumes:
  backend-data:
    name: colony-backend-data-prod
  # traefik-letsencrypt:
  #   name: traefik-letsencrypt