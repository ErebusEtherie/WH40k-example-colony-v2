# WH40k Colony Manager - Portainer Stack Configuration
# Designed for Git-based deployment in Portainer
# 
# Usage in Portainer:
#   1. Create Stack → Git Repository
#   2. Repository URL: https://github.com/yourusername/WH40k_Colony_Manager.git
#   3. Compose path: portainer-stack.yml
#   4. Set environment variables below
#
# PORTS USED:
# - Backend API: 8001 (internal: 8000)
# - Frontend: 8880 (internal: 80)
#
# PREREQUISITES:
# - Create named volumes first (optional, auto-created if not exist):
#   docker volume create colony-backend-data
#   docker volume create colony-backups

version: '3.8'

services:
  # ============================================
  # Backend API
  # ============================================
  backend:
    image: ghcr.io/erebusetherie/wh40k-colony-manager-backend:latest
    # OR build from Git (slower, requires buildkit):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: colony-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key}
      - DATABASE_PATH=/data/colony_manager.sqlite
      - LOG_LEVEL=INFO
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - RATE_LIMIT_ENABLED=true
      - MAX_LOGIN_ATTEMPTS=10
      - LOCKOUT_DURATION_MINUTES=5
      - MIN_PASSWORD_LENGTH=8
      - REQUIRE_PASSWORD_COMPLEXITY=true
      - ALLOWED_ORIGINS=http://localhost:8880,http://your-domain:8880
      - CORS_ALLOW_CREDENTIALS=true
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - COOKIE_HTTPONLY=true
    volumes:
      - colony-backend-data:/data
    networks:
      - colony-network
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Frontend Web UI
  # ============================================
  frontend:
    image: ghcr.io/erebusetherie/wh40k-colony-manager-frontend:latest
    # OR build from Git (slower, requires buildkit):
    # build:
    #   context: ./frontend
    #   dockerfile: frontend/Dockerfile
    container_name: colony-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - colony-network
    ports:
      - "8880:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  colony-network:
    driver: bridge
    name: colony-network

volumes:
  colony-backend-data:
    name: colony-backend-data
    external: false  # Set to true if volume already exists