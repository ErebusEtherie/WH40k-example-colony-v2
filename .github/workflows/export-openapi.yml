name: Export OpenAPI Schema

on:
  push:
    branches:
      - main
    paths:
      - 'src/colony_manager/adapters/api/**'
      - 'src/colony_manager/domain/models/**'
      - 'scripts/export_openapi.py'
  pull_request:
    paths:
      - 'src/colony_manager/adapters/api/**'
      - 'src/colony_manager/domain/models/**'
      - 'scripts/export_openapi.py'

jobs:
  export-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet docs/api/openapi.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes (push only)
        if: github.event_name == 'push' && steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/api/openapi.json
          git commit -m "docs: auto-update OpenAPI schema [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail PR if schema is out of date
        if: github.event_name == 'pull_request' && steps.git-check.outputs.changes == 'true'
        run: |
          echo "::error::OpenAPI schema is out of date. Please run 'python scripts/export_openapi.py' and commit the changes."
          exit 1

      - name: Upload OpenAPI spec as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-spec
          path: docs/api/openapi.json
          retention-days: 30
