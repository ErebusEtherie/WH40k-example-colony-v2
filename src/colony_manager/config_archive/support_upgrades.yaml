# Support Upgrades Configuration
# Per Rogue Trader Colony Rules
# =============================================================================

# 1. Arbites Precinct
# =============================================================================
- name: "arbites_precinct"
  display_name: "Arbites Precinct"
  description: "A detachment of Adeptus Arbites to enforce Imperial law. Adds 1 to Order and grants +10 to Command, Intimidate, and Charm Tests for legal actions."
  endeavours_required: "Lesser"
  limit_per_colony: null  # Can be purchased multiple times

# 2. Ecclesiarchy Mission
# =============================================================================
- name: "ecclesiarchy_mission"
  display_name: "Ecclesiarchy Mission"
  description: "Missionaries, schools, hospitals, or churches dedicated to the God-Emperor. Adds 1 to Piety, Order, and Complacency. Grants +10 to Tests to convince the citizenry."
  endeavours_required: "Lesser"
  limit_per_colony: null  # Can be purchased multiple times

# 3. Mechanicum Station
# =============================================================================
- name: "mechanicum_station"
  display_name: "Mechanicum Station"
  description: "Research stations, forges, or techno-arcane missions. Adds 1 to Productivity (+2 for Mining/Industry, +3 for Research Mission). May uncover ancient treasures when exploiting Archeotech Cache resources."
  endeavours_required: "Lesser"
  limit_per_colony: 1

# 4. Infantry Garrison
# =============================================================================
- name: "infantry_garrison"
  display_name: "Infantry Garrison"
  description: "A permanent presence of Imperial Guard soldiers. Adds 1 to Order, grants +10 to Command/Intimidate Tests for colony defense, and provides 100 Achievement Points bonus to Military-themed Endeavours."
  endeavours_required: "Lesser"
  limit_per_colony: 1

# 5. Imperial Navy Station
# =============================================================================
- name: "imperial_navy_station"
  display_name: "Imperial Navy Station"
  description: "A flotilla of Imperial Navy voidships. Adds 1 to Order, grants +10 to Command/Intimidate Tests for colony defense, and provides 100 Achievement Points bonus to Military-themed Endeavours."
  endeavours_required: "Lesser"
  limit_per_colony: 1

# 6. Cultural Improvement
# =============================================================================
- name: "cultural_improvement"
  display_name: "Cultural Improvement"
  description: "Shrines, statues, arenas, reliquaries, or other works that inspire piety and loyalty. Adds 1 to any one Characteristic (except Size) of the Explorer's choice."
  endeavours_required: "Lesser"
  limit_per_colony: 5  # One per stat (Complacency, Order, Productivity, Piety, and one more)

# 7. Industrial Facility
# =============================================================================
- name: "industrial_facility"
  display_name: "Industrial Facility"
  description: "Mines, refineries, foundries, or production facilities. Adds 1 to Productivity. May produce specific goods (e.g., lasguns) for further adventures."
  endeavours_required: "Lesser"
  limit_per_colony: null  # Can be purchased multiple times

# 8. Personal Lodgings
# =============================================================================
- name: "personal_lodgings"
  display_name: "Personal Lodgings"
  description: "The Rogue Trader's fortified compound, palace, or residence. Adds 1 to Order and grants +10 to Charm, Commerce, and Deceive Tests while entertaining."
  endeavours_required: "Lesser"
  limit_per_colony: 1  # No benefit after first

# 9. Contacts
# =============================================================================
- name: "contacts"
  display_name: "Contacts"
  description: "NPCs with skills, services, or knowledge of interest. Each purchase introduces 1d5 NPCs. Grants +10 to Fellowship-based Tests with affiliated groups."
  endeavours_required: "Lesser"
  limit_per_colony: null  # Can be purchased multiple times

# 10. Trappings
# =============================================================================
- name: "trappings"
  display_name: "Trappings"
  description: "Grandiose signs of the Rogue Trader's legend (monuments, trophies, effigies). Adds 1 to Complacency by inspiring and distracting the populace."
  endeavours_required: "Lesser"
  limit_per_colony: null  # Can be purchased multiple times
