# Rule Tables for WH40k Colony Manager
# Source: Rogue Trader Colony Rules (reference Excel workbook)

# =============================================================================
# Table 3-2: Colony Size to Profit Factor
# =============================================================================
size_to_profit_factor:
  - size: 0
    profit_factor: 0
    description: "Ghost Town"
  - size: 1
    profit_factor: 1
    description: "Settlement"
  - size: 2
    profit_factor: 2
    description: "Outpost"
  - size: 3
    profit_factor: 3
    description: "Freehold"
  - size: 4
    profit_factor: 4
    description: "Demesne"
  - size: 5
    profit_factor: 6
    description: "Holding"
  - size: 6
    profit_factor: 8
    description: "Dominion"
  - size: 7
    profit_factor: 10
    description: "Territory"
  - size: 8
    profit_factor: 12
    description: "City"
  - size: 9
    profit_factor: 14
    description: "Metropolis"
  - size: 10
    profit_factor: 18
    description: "Hive"

# =============================================================================
# Table 3-4: Colonial Leadership Modifier
# Based on highest of leader's Int, Per, or Fel bonus (stat / 10, floor)
# Capped at +2 for stat bonus 6 and above
# =============================================================================
leadership_modifier:
  - stat_bonus: 0
    modifier: -3
  - stat_bonus: 1
    modifier: -2
  - stat_bonus: 2
    modifier: -2
  - stat_bonus: 3
    modifier: -1
  - stat_bonus: 4
    modifier: 0
  - stat_bonus: 5
    modifier: 1
  - stat_bonus: 6
    modifier: 2

# =============================================================================
# Table 3-3: Colony Growth Roll Thresholds
# Roll 1d10 at end of each 90-day cycle
# =============================================================================
colony_growth:
  roll_interval_days: 90
  thresholds:
    - min_roll: 1
      max_roll: 2
      effect: "decrease"
      description: "Colony Size decreases by one"
    - min_roll: 3
      max_roll: 7
      effect: "no_change"
      description: "No Change"
    - min_roll: 8
      max_roll: 10
      effect: "increase"
      description: "Colony Size increases by one"
  modifiers:
    profit_factor_investment:
      description: "Per PF permanently expended"
      bonus_per_point: 1
    resource_bonus:
      description: "When using harvested resources"
      bonus_dice: "1d5"
  size_decrease_penalty:
    dice: "1d5"
    subtract: 3
    minimum: 1
    target: "random_stat_excluding_size"

# =============================================================================
# Lore State Thresholds
# Determines textual state labels based on stat values relative to Size
# =============================================================================
lore_thresholds:
  complacency:
    placated_threshold: "greater_than_size"
    zero_state: "riots_and_unrest"
    default: "stable"
  order:
    zero_state: "anarchy"
    orderly_threshold: "greater_than_size"
    default: "stable"
  productivity:
    zero_state: "halted"
    productive_threshold: "greater_than_size"
    default: "stable"
  piety:
    zero_state: "heretical"
    pious_threshold: "greater_than_size"
    default: "stable"

# =============================================================================
# Stat Loss Mitigation by Representative Type
# Certain Representative types reduce specific stat losses by 1 (to minimum 1)
# =============================================================================
stat_loss_mitigation:
  judge:
    stat: "order"
    reduction: 1
    minimum: 1
  cardinal:
    stat: "piety"
    reduction: 1
    minimum: 1
  colonist_representative:
    stat: "complacency"
    reduction: 1
    minimum: 1
  military_commander:
    stat: "productivity"
    reduction: 1
    minimum: 1

# =============================================================================
# Table 1-18: Resource Abundance Levels
# Used to display descriptive labels for resource abundance values
# =============================================================================
resource_abundance_levels:
  - min_value: 0
    max_value: 15
    label: "Minimal"
    description: "Trace amounts, not enough for sustained operation"
  - min_value: 16
    max_value: 40
    label: "Limited"
    description: "Modest supply, several years of exploitation"
  - min_value: 41
    max_value: 65
    label: "Sustainable"
    description: "Extensive reserves, viable long-term source"
  - min_value: 66
    max_value: 85
    label: "Significant"
    description: "Rich and accessible, wide variety of approaches"
  - min_value: 86
    max_value: 98
    label: "Major"
    description: "Vast potential, requires significant investment"
  - min_value: 99
    max_value: 999
    label: "Plentiful"
    description: "Seemingly limitless, decade+ to deplete"

# =============================================================================
# Game Cycles - Global Configuration
# These intervals define the cadence for colony events and growth rolls.
# The app tracks elapsed days and displays "next roll in X days" — actual
# rolling and application is done manually by players/GM.
# =============================================================================
game_cycles:
  event_roll_interval_days: 60
  development_roll_interval_days: 90

# =============================================================================
# Table 3-9: Calamitous Events
# The app does not auto-roll or enforce event outcomes. GM defines custom
# events with their own penalties/bonuses as needed.
# =============================================================================
calamitous_events:
  description: "GM-defined events only. No automatic rolling or enforcement."
  notes:
    - "Track current active event via colony.current_event field"
    - "Apply custom modifiers manually via colony.modifiers"
    - "Clear event when resolved by GM action"