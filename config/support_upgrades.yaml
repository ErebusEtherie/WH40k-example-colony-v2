# Support Upgrades for WH40k Colony Manager
# Source: Rogue Trader Colony Rules - Support Upgrades
# Non-essential upgrades that improve health, productivity, and well-being

# =============================================================================
# 1. Arbites Precinct
# =============================================================================
- name: "arbites_precinct"
  display_name: "Arbites Precinct"
  description: "A detachment of Arbitrators is petitioned from Port Wander or Scintilla to enforce Imperial law with steel-eyed resolve."
  stat_effects:
    - stat: "order"
      value: 1
  mechanical_effects:
    - description: "Explorers gain a +10 bonus to all Command, Intimidate, and Charm Tests when taking direct legal action in their colony."
      type: "skill_bonus"
      skills: ["command", "intimidate", "charm"]
      bonus: 10
      condition: "direct_legal_action"
  lore_effects:
    - "Reminds the citizenry of their duty to the Emperor and acts as a deterrent against smugglers and cultists."

# =============================================================================
# 2. Ecclesiarchy Mission
# =============================================================================
- name: "ecclesiarchy_mission"
  display_name: "Ecclesiarchy Mission"
  description: "Established through missions, hospitals, or grand cathedrals to bring the God-Emperor's light to the colonists."
  stat_effects:
    - stat: "piety"
      value: 1
  mechanical_effects:
    - description: "Tests made to convince or cajole the citizenry into action gain a +10 bonus as long as the Explorers appear sufficiently pious."
      type: "skill_bonus"
      bonus: 10
      condition: "sufficiently_pious"
  lore_effects:
    - "Constant reminders of the Emperor's grace fortify the spirit of the populace."

# =============================================================================
# 3. Mechanicum Station
# Productivity bonus varies by colony type: +1 standard, +2 Mining/Industry, +3 Research Mission
# =============================================================================
- name: "mechanicum_station"
  display_name: "Mechanicum Station"
  description: "A mission of Tech-Priests tasked with research or overseeing manufactorums."
  stat_effects:
    - stat: "productivity"
      value: 1
      conditional_bonuses:
        - colony_types: ["mining_and_industry"]
          value: 2
        - colony_types: ["research_mission"]
          value: 3
  mechanical_effects:
    - description: "Every 90 days, the station may rediscover a 'miraculous' ancient secret. Roll 1d10; on an 8+, the Explorers gain 1d5+2 items from the Treasure Generator."
      type: "periodic_roll"
      interval_days: 90
      roll: "1d10"
      threshold: 8
      reward: "1d5+2 treasure items"
  lore_effects:
    - "Brings the blessings of the Omnissiah to the colony's machines."

# =============================================================================
# 4. Infantry Garrison
# =============================================================================
- name: "infantry_garrison"
  display_name: "Infantry Garrison"
  description: "A barracks and headquarters for Imperial Guard or other military forces stationed to protect the colony. Their presence deters external threats and internal rebellion through show of force and martial discipline."
  stat_effects:
    - stat: "order"
      value: 1
  mechanical_effects:
    - description: "+10 bonus to Command and Intimidate Tests made to protect the colony from invasion or civil unrest."
      type: "skill_bonus"
      skills: ["command", "intimidate"]
      bonus: 10
      condition: "protecting_colony"
    - description: "Can be 'tapped' to grant 100 Achievement Points to military-themed Endeavours."
      type: "achievement_points"
      points: 100
      condition: "military_endeavour"
  lore_effects:
    - "Safeguards the colony against the numerous threats of the Koronus Expanse."

# =============================================================================
# 5. Imperial Navy Station
# =============================================================================
- name: "imperial_navy_station"
  display_name: "Imperial Navy Station"
  description: "A void-port, orbital dock, or aerospace facility maintained by the Imperial Navy. Enables system defense, void transport, and maintains the Rogue Trader's connection to the wider stellar neighborhood."
  stat_effects:
    - stat: "order"
      value: 1
  mechanical_effects:
    - description: "+10 bonus to Command and Intimidate Tests made to protect the colony from invasion or civil unrest."
      type: "skill_bonus"
      skills: ["command", "intimidate"]
      bonus: 10
      condition: "protecting_colony"
  lore_effects:
    - "Safeguards the colony against the numerous threats of the Koronus Expanse."

# =============================================================================
# 6. Cultural Improvement
# +1 to any one Colony Characteristic (except Size), chosen by the Explorers
# =============================================================================
- name: "cultural_improvement"
  display_name: "Cultural Improvement"
  description: "Statues of saints, arenas, reliquaries, or grand icons of religious art."
  stat_effects:
    - stat: "custom_choice"
      value: 1
      choices: ["complacency", "order", "productivity", "piety"]
      excludes: ["size"]
  mechanical_effects: []
  lore_effects:
    - "Distracts citizens from their 'grinding existence' and inspires loyalty."

# =============================================================================
# 7. Industrial Facility
# =============================================================================
- name: "industrial_facility"
  display_name: "Industrial Facility"
  description: "Refineries, foundries, and sprawling mine complexes that produce everything from rations to voidship components."
  stat_effects:
    - stat: "productivity"
      value: 1
  mechanical_effects:
    - description: "The Explorers define a specific product (e.g., lasguns), which can lead to further trade-based adventures."
      type: "product_definition"
      condition: "explorer_defined"
  lore_effects:
    - "The 'heart and soul' of a colony's economic growth."

# =============================================================================
# 8. Personal Lodgings
# =============================================================================
- name: "personal_lodgings"
  display_name: "Personal Lodgings"
  description: "A grand palace or high-quality prefabricated hab unit for the Rogue Trader's use."
  stat_effects:
    - stat: "order"
      value: 1
  mechanical_effects:
    - description: "Explorers gain a +10 bonus to Charm, Commerce, and Deceive Tests while entertaining other significant NPCs in their lodgings."
      type: "skill_bonus"
      skills: ["charm", "commerce", "deceive"]
      bonus: 10
      condition: "entertaining_npcs"
  lore_effects: []

# =============================================================================
# 9. Contacts
# =============================================================================
- name: "contacts"
  display_name: "Contacts"
  description: "Relationships with local influential NPCs, such as underworld bosses or Adeptus Mechanicus sages."
  stat_effects: []
  mechanical_effects:
    - description: "Grants a +10 bonus to Fellowship-based Tests with the affiliated group."
      type: "skill_bonus"
      skill: "fellowship"
      bonus: 10
      condition: "with_affiliated_group"
    - description: "These NPCs can also provide urgent warnings to the Explorers about burgeoning crises."
      type: "crisis_warning"
  lore_effects: []

# =============================================================================
# 10. Trappings
# =============================================================================
- name: "trappings"
  display_name: "Trappings"
  description: "Grandiose signs of the Rogue Trader's power, such as the head of an exotic predator or a massive effigy of themselves."
  stat_effects:
    - stat: "complacency"
      value: 1
  lore_effects:
    - "Designed to keep the 'populace blinded by the shining legend of their leader'."
