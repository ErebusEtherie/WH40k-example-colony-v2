# Hard Infrastructure Types for WH40k Colony Manager
# Source: Rogue Trader Colony Rules - Infrastructure Upgrades
# States: in_progress (no effect), working (bonus applies), not_working (penalty applies)

# =============================================================================
# Transport
# Roads, bridges, maglev lines, canals, and spaceports
# =============================================================================
- name: "transport"
  display_name: "Transport"
  description: "Roads, bridges, maglev lines, canals, and spaceports. Essential for moving goods and people efficiently."
  states:
    in_progress:
      description: "Infrastructure planned but not yet installed. No mechanical effect."
      modifiers: []
    working:
      description: "Infrastructure operational. Bonuses apply."
      modifiers:
        - stat: "productivity"
          value: 1
        - stat: "complacency"
          value: 1
    not_working:
      description: "Infrastructure incapacitated. Penalties apply."
      modifiers:
        - stat: "productivity"
          value: -2
        - stat: "order"
          value: -2

# =============================================================================
# Power
